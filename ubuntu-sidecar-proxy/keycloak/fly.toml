# fly.toml app configuration file generated for spike-keycloak on 2025-10-01T16:39:13-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'spike-keycloak'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile.fly'

[http_service]
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
